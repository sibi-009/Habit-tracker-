<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Habit Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Habits"/>
<meta name="theme-color" content="#7F77DD"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;color:#1a1a1a;min-height:100vh}
#bg{position:fixed;inset:0;z-index:0;background:#f7f7f5;background-size:cover;background-position:center}
#bg.has-img::after{content:'';position:fixed;inset:0;background:rgba(255,255,255,0.55)}
#app{position:relative;z-index:1;padding:20px 16px 80px;max-width:680px;margin:0 auto}
.glass{background:rgba(255,255,255,0.88);border:1px solid rgba(255,255,255,0.95);backdrop-filter:blur(10px)}
.card{border-radius:16px;padding:14px;margin-bottom:10px}
.metric{border-radius:14px;padding:12px 10px;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#7F77DD,#a89ff0)}
.metric .lbl{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:5px;font-weight:500}
.metric .val{font-size:22px;font-weight:600;letter-spacing:-0.5px}
.metric .sub{font-size:10px;color:#bbb;margin-top:2px}
.header{margin-bottom:20px}
.header h1{font-size:26px;font-weight:600;letter-spacing:-0.5px}
.header .dt{font-size:13px;color:#999;margin-top:2px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px}
.tabs{display:flex;gap:6px;margin-bottom:16px;align-items:center}
.tab{padding:6px 14px;border-radius:20px;font-size:13px;border:1.5px solid #e0e0e0;background:rgba(255,255,255,0.85);color:#888;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer}
.tab.active{border-color:#7F77DD;background:#7F77DD;color:#fff}
.add-btn{margin-left:auto;padding:6px 14px;border-radius:20px;font-size:13px;border:1.5px solid #7F77DD;background:rgba(255,255,255,0.85);color:#7F77DD;font-weight:500;font-family:'Inter',sans-serif;cursor:pointer}
.habit-row{display:flex;align-items:center;gap:10px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid #ddd;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all 0.2s}
.hname{font-weight:500;font-size:14px;flex:1}
.hname.done{text-decoration:line-through;color:#ccc}
.hmeta{font-size:11px;color:#bbb;margin-top:2px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.sbadge{display:inline-flex;align-items:center;gap:2px;background:#fff8f0;border:1px solid #ffe0b2;border-radius:20px;padding:1px 6px;font-size:10px;color:#e67e22;font-weight:500}
.ibtn{background:transparent;border:none;padding:2px 4px;font-size:13px;color:#ccc;cursor:pointer}
.cat-sec{margin-bottom:16px}
.cat-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cname{font-size:10px;font-weight:600;color:#bbb;text-transform:uppercase;letter-spacing:0.07em}
.cal-wrap{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.06)}
.cal-lbl{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:0.06em;font-weight:500}
.notes-wrap{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.06)}
.notes-lbl{font-size:10px;color:#bbb;text-transform:uppercase;letter-spacing:0.06em;font-weight:500;margin-bottom:4px}
textarea{width:100%;padding:7px 10px;border:1.5px solid #ebebeb;border-radius:10px;font-size:13px;font-family:'Inter',sans-serif;background:rgba(255,255,255,0.9);color:#1a1a1a;outline:none;resize:none}
textarea:focus{border-color:#7F77DD}
.snbtn{margin-top:4px;padding:4px 12px;font-size:12px;border:1.5px solid #7F77DD;border-radius:8px;background:transparent;color:#7F77DD;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}
.prog-card{border-radius:12px;padding:10px 12px;margin-bottom:8px}
.prog-top{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.prog-name{font-weight:500;font-size:13px;flex:1}
.prog-stat{font-size:11px;color:#aaa;white-space:nowrap}
.pbar-wrap{background:rgba(0,0,0,0.06);border-radius:20px;height:4px;overflow:hidden;margin-bottom:8px}
.pbar{height:100%;border-radius:20px;transition:width 0.4s}

/* DOT GRID - fixed 14px, no gaps from empty cells */
.dot-grid{display:inline-grid;grid-template-columns:repeat(7,14px);gap:2px}
.wd-grid{display:inline-grid;grid-template-columns:repeat(7,14px);gap:2px;margin-bottom:3px}
.wd-lbl{width:14px;font-size:7px;color:#ccc;text-align:center;font-weight:500;line-height:14px}
.dot{width:14px;height:14px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:600;border:1px solid transparent;cursor:default}
.dot.clickable{cursor:pointer}
.dot.empty{background:transparent;border:none}
.dot.future{background:#f0f0f0;color:#ddd}
.dot.missed{background:#f0f0f0;color:#ccc}
.dot.done{color:#fff}
.dot.istoday{border-width:2px}

.overall-wrap{border-radius:12px;padding:10px 12px;margin-bottom:12px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:999}
.modal{background:#fff;border-radius:24px 24px 0 0;padding:22px 20px 36px;width:100%;max-width:480px}
.modal-title{font-size:16px;font-weight:600;margin-bottom:16px}
.flbl{font-size:12px;color:#aaa;margin-bottom:4px;font-weight:500}
input,select{width:100%;padding:9px 12px;border:1.5px solid #ebebeb;border-radius:10px;font-size:14px;font-family:'Inter',sans-serif;background:#fafafa;color:#1a1a1a;outline:none;margin-bottom:12px}
input:focus,select:focus{border-color:#7F77DD;background:#fff}
.mbtns{display:flex;gap:10px;margin-top:4px}
.bcncl{flex:1;padding:11px;border:1.5px solid #ebebeb;border-radius:12px;background:#fff;color:#999;font-size:14px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif}
.bsave{flex:2;padding:11px;border:none;border-radius:12px;background:#7F77DD;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.inst-banner{background:linear-gradient(135deg,#7F77DD,#a89ff0);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.inst-btn{background:#fff;color:#7F77DD;border:none;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
.close-b{background:transparent;border:none;color:rgba(255,255,255,0.6);font-size:20px;cursor:pointer;padding:0}
.bg-btn{position:fixed;bottom:20px;right:16px;z-index:10;background:rgba(255,255,255,0.92);border:1.5px solid #e0e0e0;border-radius:50px;padding:8px 14px;font-size:12px;font-weight:500;color:#888;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(0,0,0,0.1)}
.empty-state{text-align:center;padding:40px 20px;color:#ccc}
.empty-icon{font-size:36px;margin-bottom:8px}
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef}=React;
const CATS=["Health","Work","Personal","Learning","Fitness","Mindfulness"];
const CAT_COLOR={Health:"#34C97A",Work:"#378ADD",Personal:"#D4537E",Learning:"#F0A500",Fitness:"#FF6B35",Mindfulness:"#7F77DD"};
const WD=["S","M","T","W","T","F","S"];
const pad=n=>String(n).padStart(2,'0');
const todayStr=()=>new Date().toISOString().slice(0,10);
const getDays=(y,m)=>new Date(y,m+1,0).getDate();
const getFirst=(y,m)=>new Date(y,m,1).getDay();
const DEFAULT=[
  {id:1,name:"Morning Run 🏃",category:"Fitness",color:"#FF6B35",reminder:"07:00",completions:{},notes:{}},
  {id:2,name:"Read Books 📚",category:"Learning",color:"#F0A500",reminder:"21:00",completions:{},notes:{}},
  {id:3,name:"Meditate 🧘",category:"Mindfulness",color:"#7F77DD",reminder:"08:00",completions:{},notes:{}},
];
function load(){try{const s=localStorage.getItem("ht7");return s?JSON.parse(s):DEFAULT;}catch{return DEFAULT;}}
function save(h){try{localStorage.setItem("ht7",JSON.stringify(h));}catch{}}
function loadBg(){try{return localStorage.getItem("ht7_bg")||"";}catch{return "";}}
function saveBg(v){try{localStorage.setItem("ht7_bg",v);}catch{}}
function streakOf(c){let s=0;const now=new Date();now.setHours(0,0,0,0);let d=new Date(now);while(true){const k=d.toISOString().slice(0,10);if(c[k]){s++;d=new Date(d-86400000);}else break;}return s;}
function mDone(c,y,m,upto){let n=0;for(let i=1;i<=upto;i++){if(c[`${y}-${pad(m+1)}-${pad(i)}`])n++;}return n;}

function DotGrid({h,daysInMonth,firstDay,year,month,today,clickable,onToggle}){
  // Build a flat array of 7*rows cells — empty slots have no height issue in grid
  const cells=[];
  for(let i=0;i<firstDay;i++) cells.push(<div key={`e${i}`} className="dot empty"/>);
  for(let d=1;d<=daysInMonth;d++){
    const k=`${year}-${pad(month+1)}-${pad(d)}`;
    const isFuture=d>today,isDone=!!h.completions[k],isToday=d===today;
    let cls="dot"+(clickable&&!isFuture?" clickable":"");
    if(isFuture) cls+=" future";
    else if(isDone) cls+=" done";
    else cls+=" missed";
    if(isToday) cls+=" istoday";
    cells.push(
      <div key={d} className={cls}
        style={isDone?{background:h.color,borderColor:h.color}:isToday&&!isDone?{borderColor:h.color,color:h.color,background:`${h.color}18`}:{}}
        onClick={()=>clickable&&!isFuture&&onToggle&&onToggle(h.id,k)}
      >{d}</div>
    );
  }
  return(
    <div>
      <div className="wd-grid">{WD.map((w,i)=><div key={i} className="wd-lbl">{w}</div>)}</div>
      <div className="dot-grid">{cells}</div>
    </div>
  );
}

function App(){
  const [habits,setHabitsRaw]=useState(load);
  const [view,setView]=useState("today");
  const [modal,setModal]=useState(null);
  const [expanded,setExpanded]=useState(null);
  const [noteVals,setNoteVals]=useState({});
  const [form,setForm]=useState({});
  const [deferredPrompt,setDeferredPrompt]=useState(null);
  const [showBanner,setShowBanner]=useState(false);
  const [bgImg,setBgImg]=useState(loadBg);
  const fileRef=useRef(null);

  const now=new Date();
  const year=now.getFullYear(),month=now.getMonth(),today=now.getDate();
  const t=todayStr();
  const monthName=now.toLocaleDateString("en-IN",{month:"long",year:"numeric"});
  const dateLabel=now.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"});
  const daysInMonth=getDays(year,month),firstDay=getFirst(year,month);

  useEffect(()=>{
    const el=document.getElementById("bg");
    if(bgImg){el.style.backgroundImage=`url(${bgImg})`;el.classList.add("has-img");}
    else{el.style.backgroundImage="none";el.classList.remove("has-img");}
  },[bgImg]);

  useEffect(()=>{
    const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%237F77DD'/><text y='.85em' x='50' font-size='55' text-anchor='middle'>✅</text></svg>`;
    const m={name:"My Habit Tracker",short_name:"Habits",start_url:".",display:"standalone",background_color:"#f7f7f5",theme_color:"#7F77DD",icons:[{src:`data:image/svg+xml,${svg}`,sizes:"192x192",type:"image/svg+xml"}]};
    const l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l);
    const h=e=>{e.preventDefault();setDeferredPrompt(e);setShowBanner(true);};
    window.addEventListener("beforeinstallprompt",h);
    return()=>window.removeEventListener("beforeinstallprompt",h);
  },[]);

  function setHabits(fn){setHabitsRaw(h=>{const next=typeof fn==="function"?fn(h):fn;save(next);return next;});}
  function toggleDate(id,k){setHabits(hs=>hs.map(h=>h.id===id?{...h,completions:{...h.completions,[k]:!h.completions[k]}}:h));}
  function toggle(id){toggleDate(id,t);}
  function saveNote(id){const v=noteVals[id]||"";setHabits(hs=>hs.map(h=>h.id===id?{...h,notes:{...h.notes,[t]:v}}:h));}
  function delHabit(id){setHabits(hs=>hs.filter(h=>h.id!==id));if(expanded===id)setExpanded(null);}
  function openAdd(){setForm({name:"",category:"Health",color:CAT_COLOR["Health"],reminder:"",id:null});setModal("edit");}
  function openEdit(h){setForm({...h});setModal("edit");}
  function saveForm(){if(!form.name.trim())return;if(form.id)setHabits(hs=>hs.map(h=>h.id===form.id?{...h,...form}:h));else setHabits(hs=>[...hs,{...form,id:Date.now(),completions:{},notes:{}}]);setModal(null);}
  function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{setDeferredPrompt(null);setShowBanner(false);});}
  
  // BG: if already set → show options modal, else open file picker
  function handleBgBtn(){
    if(bgImg){ if(window.confirm("Remove background image?")){ setBgImg(""); saveBg(""); } }
    else{ fileRef.current.click(); }
  }
  function handleBgUpload(e){
    const file=e.target.files[0];
    if(!file)return;
    // Reset input so same file can be picked again
    e.target.value="";
    const r=new FileReader();
    r.onload=ev=>{setBgImg(ev.target.result);saveBg(ev.target.result);};
    r.readAsDataURL(file);
  }

  const grouped=CATS.reduce((acc,c)=>{const hs=habits.filter(h=>h.category===c);if(hs.length)acc[c]=hs;return acc;},{});
  const doneToday=habits.filter(h=>h.completions[t]).length;
  const bestStreak=habits.length?Math.max(...habits.map(h=>streakOf(h.completions))):0;
  const totalDone=habits.reduce((a,h)=>a+mDone(h.completions,year,month,today),0);
  const monthPct=habits.length&&today?Math.round(totalDone/(habits.length*today)*100):0;

  return(
    <div>
      {showBanner&&(
        <div className="inst-banner">
          <div><p style={{fontSize:13,fontWeight:500}}>Add to Home Screen</p><span style={{fontSize:11,opacity:0.8,display:"block",marginTop:1}}>Install as an app</span></div>
          <div style={{display:"flex",gap:8,alignItems:"center"}}>
            <button className="inst-btn" onClick={installApp}>Install</button>
            <button className="close-b" onClick={()=>setShowBanner(false)}>×</button>
          </div>
        </div>
      )}

      <div className="header"><h1>My habits</h1><div className="dt">{dateLabel}</div></div>

      <div className="metrics">
        {[["Done today",`${doneToday}/${habits.length}`,"today"],["Best streak",`${bestStreak}d`,"all time"],["Month avg",`${monthPct}%`,monthName]].map(([l,v,s])=>(
          <div className="metric glass" key={l}><div className="lbl">{l}</div><div className="val">{v}</div><div className="sub">{s}</div></div>
        ))}
      </div>

      <div className="tabs">
        <button className={`tab${view==="today"?" active":""}`} onClick={()=>setView("today")}>Today</button>
        <button className={`tab${view==="progress"?" active":""}`} onClick={()=>setView("progress")}>Progress</button>
        <button className="add-btn" onClick={openAdd}>+ Add habit</button>
      </div>

      {view==="today"&&(
        <div>
          {Object.entries(grouped).map(([cat,hs])=>(
            <div key={cat} className="cat-sec">
              <div className="cat-hdr"><span className="cdot" style={{background:CAT_COLOR[cat]}}/><span className="cname">{cat}</span></div>
              {hs.map(h=>{
                const done=!!h.completions[t],isOpen=expanded===h.id,streak=streakOf(h.completions);
                return(
                  <div className="card glass" key={h.id}>
                    <div className="habit-row">
                      <button className="chk" onClick={()=>toggle(h.id)} style={{borderColor:done?h.color:"#ddd",background:done?h.color:"transparent"}}>
                        {done&&<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </button>
                      <div style={{flex:1,minWidth:0}}>
                        <div className={`hname${done?" done":""}`}>{h.name}</div>
                        <div className="hmeta">
                          {streak>0&&<span className="sbadge">🔥 {streak}d</span>}
                          {h.reminder&&<span>⏰ {h.reminder}</span>}
                        </div>
                      </div>
                      <button className="ibtn" onClick={()=>setExpanded(isOpen?null:h.id)}>{isOpen?"▲":"▼"}</button>
                      <button className="ibtn" onClick={()=>openEdit(h)}>✏️</button>
                      <button className="ibtn" onClick={()=>delHabit(h.id)}>🗑</button>
                    </div>
                    {isOpen&&(
                      <div>
                        <div className="cal-wrap">
                          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                            <span className="cal-lbl">{monthName}</span>
                            <span style={{fontSize:10,color:"#bbb"}}>{mDone(h.completions,year,month,today)}/{today}d</span>
                          </div>
                          <DotGrid h={h} daysInMonth={daysInMonth} firstDay={firstDay} year={year} month={month} today={today} clickable={true} onToggle={toggleDate}/>
                        </div>
                        <div className="notes-wrap">
                          <div className="notes-lbl">Today's note</div>
                          <textarea rows={2} placeholder="How did it go today?" defaultValue={h.notes[t]||""} onChange={e=>setNoteVals(n=>({...n,[h.id]:e.target.value}))}/>
                          <button className="snbtn" onClick={()=>saveNote(h.id)}>Save</button>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          ))}
          {habits.length===0&&<div className="empty-state"><div className="empty-icon">🌱</div><p>No habits yet.<br/>Tap "+ Add habit" to start.</p></div>}
        </div>
      )}

      {view==="progress"&&(
        <div>
          <div className="overall-wrap glass">
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
              <span style={{fontSize:12,fontWeight:500,color:"#888"}}>Overall · {monthName}</span>
              <span style={{fontSize:12,color:"#aaa"}}>{monthPct}%</span>
            </div>
            <div className="pbar-wrap"><div className="pbar" style={{width:`${monthPct}%`,background:"linear-gradient(90deg,#7F77DD,#a89ff0)"}}/></div>
          </div>
          {habits.map(h=>{
            const done=mDone(h.completions,year,month,today);
            const pct=today?Math.round(done/today*100):0;
            const recentNotes=Object.entries(h.notes||{}).filter(([,v])=>v).slice(-2).reverse();
            return(
              <div className="prog-card glass" key={h.id}>
                <div className="prog-top">
                  <span className="cdot" style={{background:h.color}}/>
                  <span className="prog-name">{h.name}</span>
                  <span className="prog-stat">{done}/{today}d · {pct}%</span>
                </div>
                <div className="pbar-wrap"><div className="pbar" style={{width:`${pct}%`,background:h.color}}/></div>
                <DotGrid h={h} daysInMonth={daysInMonth} firstDay={firstDay} year={year} month={month} today={today} clickable={false}/>
                {recentNotes.length>0&&(
                  <div style={{marginTop:7,paddingTop:7,borderTop:"1px solid rgba(0,0,0,0.05)"}}>
                    {recentNotes.map(([date,note])=>(
                      <div key={date} style={{fontSize:11,color:"#888",marginBottom:2}}><span style={{color:"#ccc",fontSize:10}}>{date}: </span>{note}</div>
                    ))}
                  </div>
                )}
              </div>
            );
          })}
          {habits.length===0&&<div className="empty-state"><div className="empty-icon">📊</div><p>No habits to track yet.</p></div>}
        </div>
      )}

      {modal==="edit"&&(
        <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)setModal(null)}}>
          <div className="modal">
            <div className="modal-title">{form.id?"Edit habit ✏️":"New habit ✨"}</div>
            <div className="flbl">Habit name</div>
            <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Morning yoga 🧘"/>
            <div className="flbl">Category</div>
            <select value={form.category} onChange={e=>setForm(f=>({...f,category:e.target.value,color:CAT_COLOR[e.target.value]}))}>
              {CATS.map(c=><option key={c} value={c}>{c}</option>)}
            </select>
            <div className="flbl">Reminder time (optional)</div>
            <input type="time" value={form.reminder} onChange={e=>setForm(f=>({...f,reminder:e.target.value}))}/>
            <div className="mbtns">
              <button className="bcncl" onClick={()=>setModal(null)}>Cancel</button>
              <button className="bsave" onClick={saveForm}>Save habit</button>
            </div>
          </div>
        </div>
      )}

      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleBgUpload}/>
      <button className="bg-btn" onClick={handleBgBtn}>
        {bgImg?"🖼 Change / Remove bg":"🖼 Set background"}
      </button>
    </div>
  );
}

</script>
